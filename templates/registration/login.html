{% load i18n %}<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% trans "Login" %} – InsyrtCRM</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 flex items-center justify-center min-h-screen">
  <div class="bg-white shadow rounded-lg p-8 w-full max-w-sm">
    <h1 class="text-2xl font-bold text-indigo-600 mb-6 text-center">InsyrtCRM</h1>
    {% if form.errors %}
    <div class="bg-red-50 text-red-700 text-sm rounded px-3 py-2 mb-4">
      {% trans "Incorrect username or password." %}
    </div>
    {% endif %}
    <form method="post">
      {% csrf_token %}
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-1">{% trans "Username" %}</label>
        <input type="text" name="username" autofocus required
          class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-1">{% trans "Password" %}</label>
        <input type="password" name="password" required
          class="w-full border border-gray-300 rounded px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
      </div>
      <input type="hidden" name="next" value="{{ next }}">
      <button type="submit"
        class="w-full bg-indigo-600 text-white rounded px-4 py-2 text-sm font-semibold hover:bg-indigo-700">
        {% trans "Log in" %}
      </button>
    </form>
  </div>
</body>
</html>
