[project]
name = "insyrtcrm"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "django>=6.0,<7",
    "django-environ>=0.13.0",
    "django-q2>=1.10.0",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "redis>=7.4.0",
    "uvicorn[standard]>=0.46.0",
]

[dependency-groups]
dev = [
    "factory-boy>=3.3.3",
    "pre-commit>=4.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.12.0",
    "ruff>=0.15.12",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "DJ",  # flake8-django
    "N",   # pep8-naming
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    "RUF012", # ClassVar for mutable class attributes — Django models use them
]

[tool.ruff.lint.isort]
known-first-party = ["insyrtcrm", "apps"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "insyrtcrm.settings.dev"
python_files = ["test_*.py", "*_test.py"]
addopts = "--strict-markers --tb=short"
